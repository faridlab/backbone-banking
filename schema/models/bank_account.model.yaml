# =============================================================================
# Domain: Banking
# Entities: Bank (master) + BankAccount
# Description: The catalogue of banks and the company's accounts at them. A
# BankAccount carries TWO logical GL account refs: `gl_account_id` (the real Bank
# account) and `clearing_account_id` (the undeposited-funds / clearing account a
# payment settles to). Banking clears value from clearing → bank on statement
# match. Region-neutral; Indonesian bank seed + Virtual Account is an overlay.
# =============================================================================

models:
  - name: Bank
    collection: banks
    description: "A bank the company holds accounts at"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique bank id"
      name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Bank name (e.g. Bank Central Asia)"
      swift_bic:
        type: string?
        attributes: ["@max(11)"]
        description: "SWIFT/BIC code"
      country:
        type: string
        attributes: ["@default(\"ID\")", "@max(2)"]
        description: "ISO country code"
      status:
        type: BankStatus
        attributes: ["@default(active)"]
        description: "Lifecycle of the bank catalogue entry"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic.

  - name: BankAccount
    collection: bank_accounts
    description: "A company account at a bank; links the real bank GL account + its clearing account"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique account id"
      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Branch # logical FK to organization.Branch.id"
      bank_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Bank.id)"]
        description: "Owning bank"
      account_name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Account holder / label"
      account_number:
        type: string
        attributes: ["@required", "@max(60)"]
        description: "Account number — local format, or IBAN (registry country + mod-97 checked fail-closed at the write path)"
      gl_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The real Bank GL account # logical FK to accounting.Account.id"
      clearing_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Undeposited-funds / clearing GL account # logical FK to accounting.Account.id"
      currency:
        type: string
        attributes: ["@default(\"IDR\")", "@max(3)"]
        description: "ISO currency code"
      account_type:
        type: BankAccountType
        attributes: ["@default(checking)"]
        description: "Kind of account"
      is_default:
        type: bool
        attributes: ["@default(false)"]
        description: "Company default for this currency"
      status:
        type: BankAccountStatus
        attributes: ["@default(active)"]
        description: "Lifecycle of the account; closed accounts keep their history"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
      # one-live-account-number-per-bank unique — (org_unit_id, bank_id,
      # account_number) among live rows — is installed by the composing service's
      # tenancy decorator, not declared here. bank_id is a globally unique UUID, so
      # the org-scoped form is exactly equivalent to the pre-strip per-company one.

enums:
  - name: BankStatus
    description: "Lifecycle of a bank catalogue entry"
    variants:
      - name: active
        description: "Available for selection when opening accounts"
        default: true
      - name: inactive
        description: "Withdrawn; existing accounts keep operating"

  - name: BankAccountStatus
    description: "Lifecycle of a company account at a bank"
    variants:
      - name: active
        description: "Usable for settlement and clearance"
        default: true
      - name: inactive
        description: "Closed or suspended; history and clears remain"

  - name: BankAccountType
    description: "Kind of bank account"
    variants:
      - name: checking
        description: "Current/checking account"
        default: true
      - name: savings
        description: "Savings account"
      - name: virtual_account
        description: "Bank virtual account (Indonesian collection)"
      - name: wallet
        description: "E-wallet float account"
      - name: escrow
        description: "Escrow account"
